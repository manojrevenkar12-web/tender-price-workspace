apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tender-price
labels:
  - pairs:
      app.kubernetes.io/part-of: tender-price-workspace
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  - network-policy.yaml
images:
  - name: tpw-api
    newName: tpw-api
    newTag: latest
  - name: tpw-web
    newName: tpw-web
    newTag: latest
