# Runs before each rollout (Argo CD / Flux sync wave -1, or `kubectl apply` then wait). The
# migrator takes an advisory lock, so two runs at once are safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: tpw-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpw-migrate
    spec:
      restartPolicy: Never
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: tpw-api
          command: ["node", "src/migrate.ts"]
          envFrom:
            - configMapRef: { name: tpw-config }
            - secretRef: { name: tpw-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
