apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpw-web
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: tpw-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tpw-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: tpw-web
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: API_UPSTREAM, value: "http://tpw-api:4000" }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: tpw-web
spec:
  selector: { app.kubernetes.io/name: tpw-web }
  ports: [{ name: http, port: 80, targetPort: http }]
