apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpw-api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: tpw-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tpw-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "4000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: tpw-api }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: tpw-api
          ports: [{ name: http, containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: tpw-config }
            - secretRef: { name: tpw-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: tpw-api
spec:
  selector: { app.kubernetes.io/name: tpw-api }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tpw-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tpw-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tpw-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tpw-api }
