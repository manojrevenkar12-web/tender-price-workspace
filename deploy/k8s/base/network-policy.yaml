# Only the web pods reach the API; only the API and the worker leave the namespace (database,
# model API). Everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tpw-web }
  ingress:
    - ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-web-and-monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tpw-api }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: tpw-web }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 4000 }]
