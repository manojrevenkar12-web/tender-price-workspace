# Benchmarks, price contributions and regional levels. Jobs are claimed with
# FOR UPDATE SKIP LOCKED, so any number of workers can run side by side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpw-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: tpw-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tpw-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: tpw-api
          command: ["node", "src/worker.ts"]
          ports: [{ name: health, containerPort: 4001 }]
          envFrom:
            - configMapRef: { name: tpw-config }
            - secretRef: { name: tpw-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
