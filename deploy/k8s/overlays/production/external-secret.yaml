# Filled by the External Secrets Operator from the Secrets Manager entry Terraform creates
# (deploy/terraform: aws_secretsmanager_secret.app).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tpw-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: tpw-secrets }
  dataFrom:
    - extract: { key: tender-price/production/app }
